name: Stage 1 Source Checks
on:
  push:
    branches:
      - stage1/stabilization-fixes
  pull_request:
    branches:
      - stage1/stabilization-fixes
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
